<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exams — School Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main-content">
    <div id="header"></div>
    <main class="page-body">

      <div class="page-header">
        <div class="page-header-text">
          <h1>Exams</h1>
          <p>Create exams, enter marks, and manage student results.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-outline btn-sm" onclick="showToast('Results export coming in Phase 8', 'info')">
            <i data-lucide="download" style="width:15px;height:15px"></i>
            Export Results
          </button>
          <button class="btn btn-primary btn-sm" onclick="showToast('Add exam coming in Phase 8', 'info')">
            <i data-lucide="plus" style="width:15px;height:15px"></i>
            Add Exam
          </button>
        </div>
      </div>

      <div id="statsGrid"></div>

      <div class="data-section">
        <div class="data-section-header">
          <div class="data-section-title">Exams</div>
          <div class="data-section-actions">
            <select class="form-select" style="width:auto;padding:7px 12px;font-size:13px" id="classFilter">
              <option value="">All Classes</option>
            </select>
            <div class="search-wrap">
              <i data-lucide="search" style="width:14px;height:14px"></i>
              <input type="text" class="search-input" placeholder="Search exams..." id="examSearch">
            </div>
          </div>
        </div>
        <div id="examsTable"></div>
        <div class="data-table-footer">
          <span>Connect Supabase to load exam data</span>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="components/toast.js"></script>
<script src="components/modal.js"></script>
<script src="components/sidebar.js"></script>
<script src="components/header.js"></script>
<script src="components/statCard.js"></script>
<script src="components/table.js"></script>
<script src="js/exams.js"></script>
</body>
</html>
