<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schools — School Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/super-admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-layout super-admin-layout">
  <div id="sidebar"></div>
  <div class="main-content">
    <div id="header"></div>
    <main class="page-body">

      <div class="page-header">
        <div class="page-header-text">
          <h1>Schools <span class="super-admin-tag">Super Admin</span></h1>
          <p>All registered schools on the School Plus platform.</p>
        </div>
        <div class="page-actions">
          <select class="form-select btn-sm" style="width:auto;padding:7px 14px;font-size:13px" id="statusFilter">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="trial">In Trial</option>
            <option value="expired">Expired</option>
            <option value="suspended">Suspended</option>
          </select>
          <select class="form-select btn-sm" style="width:auto;padding:7px 14px;font-size:13px" id="planFilter">
            <option value="">All Plans</option>
            <option value="basic">Basic</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
          </select>
          <div class="search-wrap">
            <i data-lucide="search" style="width:14px;height:14px"></i>
            <input type="text" class="search-input" placeholder="Search schools..." id="schoolSearch">
          </div>
        </div>
      </div>

      <div id="statsGrid"></div>

      <div class="data-section">
        <div class="data-section-header">
          <div class="data-section-title">All Schools</div>
        </div>
        <div id="schoolsTable"></div>
        <div class="data-table-footer">
          <span>Connect Supabase to load school data</span>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="components/toast.js"></script>
<script src="components/modal.js"></script>
<script src="components/sidebar.js"></script>
<script src="components/header.js"></script>
<script src="components/statCard.js"></script>
<script src="components/table.js"></script>
<script src="js/schools.js"></script>
</body>
</html>
